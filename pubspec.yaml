name: revive_launcher
description: Revive Launcher for Android
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^10.3.7
  flutter_secure_storage: ^9.2.4
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.10.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/seasons/
    - third_party/ATLAS-Link-LICENSE.txt
