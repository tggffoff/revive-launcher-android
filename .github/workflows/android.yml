name: Android APK

on:
  push:
    branches:
      - main
      - 'rebuild/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native Android project
        run: flutter create --no-pub --platforms=android --org com.revive --project-name revive_launcher .

      - name: Configure internet permission and Discord deep link
        run: python3 tool/configure_android.py

      - name: Resolve packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Widget tests
        run: flutter test --no-pub

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: revive-launcher-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
